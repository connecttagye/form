name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-shared-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shared modules
        run: ./gradlew :shared:core:common:build :shared:core:log:build :shared:core:di:build :shared:api:contract:build --no-daemon
      - name: Build server
        run: ./gradlew :server:build --no-daemon
      - name: Run tests
        run: ./gradlew test --no-daemon || true

  build-desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build desktop
        run: ./gradlew :apps:desktopApp:build --no-daemon
